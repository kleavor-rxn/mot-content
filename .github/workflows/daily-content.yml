# Publie chaque jour bundle.json + daily.json sur GitHub Pages.
#
# Prérequis (une fois, manuel) : Settings → Pages → Source = "GitHub Actions".
# URL publiée : https://kleavor-rxn.github.io/mots-nombres-ios/
name: daily-content

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC — 07:00 Paris
  push:
    branches: [main, develop]
    paths:
      - "content/**"
      - ".github/workflows/daily-content.yml"
  workflow_dispatch:

permissions:
  contents: write # le run fige le calendrier des mots fléchés (commit)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Générer bundle.json + daily.json
        run: node content/scripts/generate.mjs

      # Le calendrier gelé (date → grille) s'étend à chaque génération : il
      # doit être commité, sinon le gel ne survit pas au runner éphémère et
      # une date déjà servie pourrait changer de grille si le pool grandit.
      # [skip ci] : le push ne redéclenche pas ce workflow.
      - name: Figer le calendrier des mots fléchés
        run: |
          if ! git diff --quiet content/pool/crossword-schedule.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/pool/crossword-schedule.json
            git commit -m "chore: calendrier mots fléchés étendu [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
